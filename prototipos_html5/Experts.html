<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Animalec+ | Especialistas</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial;background:#f2fafb;color:#163c50}header{background:#075a67;color:white;padding:22px 6%}main{max-width:1100px;margin:32px auto;padding:0 20px}.panel,article{background:white;border:1px solid #d8e7ed;border-radius:16px;padding:22px;margin-bottom:22px;box-shadow:0 6px 18px #163c5010}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}input,select{padding:12px;border:1px solid #bbd3df;border-radius:9px;max-width:100%}label{display:block;margin:10px 0}button{background:#ffc653;border:0;border-radius:9px;padding:12px;cursor:pointer}.actions{display:flex;gap:10px;flex-wrap:wrap}@media(max-width:550px){header{padding:16px}main{margin:18px auto}input,select{width:100%}}</style></head><body>
<header><strong>Animalec+ | Administração</strong></header><main><h1>Especialistas</h1><p>Protótipo HTML5 responsivo • Tarefa 3.1b • Dados fictícios.</p><section class="panel"><h2>Pesquisa e filtros</h2><div class="actions"><input id="q" placeholder="Pesquisar por nome ou área" aria-label="Pesquisar"><select id="status" aria-label="Estado"><option>Todos</option><option>Ativo</option><option>Inativo</option></select><button id="new">+ Novo registo</button></div></section><section><h2>Registos</h2><div id="list" class="grid"></div></section><section class="panel" id="editor" hidden><h2 id="form-title">Novo registo</h2><form id="form"><label>Nome <input name="name" required></label><label>Área <input name="area" required></label><label>E-mail <input name="email" type="email" required></label><label>Estado <select name="status"><option>Ativo</option><option>Inativo</option></select></label><div class="actions"><button type="submit">Guardar</button><button type="button" id="cancel">Cancelar</button></div></form></section></main>
<script>
const storageKey='animalec:prototype:experts';let data;try{data=JSON.parse(localStorage.getItem(storageKey)||'null')}catch(e){data=null}if(!Array.isArray(data))data=[{id:1,name:'Exemplo de Especialistas',area:'Educação ambiental',email:'exemplo@example.org',status:'Ativo'}];let selected=null;const $=x=>document.getElementById(x),esc=x=>String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem(storageKey,JSON.stringify(data))}catch(e){}}function draw(){const q=$('q').value.toLowerCase(),s=$('status').value;$('list').innerHTML=data.filter(x=>(x.name+' '+x.area).toLowerCase().includes(q)&&(s==='Todos'||x.status===s)).map(x=>`<article><h3>${esc(x.name)}</h3><p>${esc(x.area)} · ${esc(x.status)}</p><p>${esc(x.email)}</p><button data-action="edit" data-id="${x.id}">Editar</button> <button data-action="delete" data-id="${x.id}">Eliminar</button></article>`).join('')||'<p>Sem resultados.</p>'}$('list').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const id=Number(b.dataset.id),x=data.find(x=>x.id===id);if(b.dataset.action==='delete'){if(confirm('Eliminar este registo?')){data=data.filter(x=>x.id!==id);save();draw()}}else if(x){selected=id;Object.keys(x).forEach(k=>{if($('form').elements[k])$('form').elements[k].value=x[k]});$('editor').hidden=false}});$('new').onclick=()=>{selected=null;$('form').reset();$('editor').hidden=false};$('cancel').onclick=()=>{$('editor').hidden=true};$('form').onsubmit=e=>{e.preventDefault();const v=Object.fromEntries(new FormData(e.target).entries());if(selected!==null){Object.assign(data.find(x=>x.id===selected),v)}else{data.push({...v,id:Date.now()})}save();draw();$('editor').hidden=true};$('q').oninput=draw;$('status').onchange=draw;draw();
</script></body></html>
